_schema-version: "3.2"
ID: podzone
version: 1.0.0
description: "PODZO Transporter & POD Execution Portal for SAP Build Work Zone"

parameters:
  enable-parallel-deployments: true

modules:
  # ── 1. Backend API Service ──────────────────────────────────────────
  - name: podzone-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    provides:
      - name: podzone-srv-api
        properties:
          srv-url: ${default-url}
    properties:
      NODE_ENV: production
    build-parameters:
      ignore:
        - node_modules
        - dist
        - e2e_live_test.spec.ts

  # ── 2. Frontend Work Zone Portal App ────────────────────────────────
  - name: podzone
    type: html5
    path: .
    build-parameters:
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
      target-path: dist
    parameters:
      buildpack: staticfile_buildpack
      memory: 128M
      disk-quota: 256M
    requires:
      - name: podzone-srv-api
        group: dest
        properties:
          name: srv-api
          url: ~{srv-url}
