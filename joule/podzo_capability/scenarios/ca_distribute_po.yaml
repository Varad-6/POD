description: |
  Distributes an approved SAP Purchase Order to a selected transporter vendor.

slots:
  - name: po_id
    description: Purchase Order Number or ID
  - name: transporter_id
    description: Transporter vendor name or ID

response_context:
  - value: $target_result.job_config_id
    description: Job Config ID
  - value: $target_result.message
    description: Distribution status

target:
  name: distribute_po
  type: function
