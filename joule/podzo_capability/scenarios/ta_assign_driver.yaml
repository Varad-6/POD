description: |
  Pairs a fleet driver and vehicle to a transport run.

slots:
  - name: driver_id
    description: Driver name or ID
  - name: vehicle_id
    description: Vehicle registration or ID
  - name: po_id
    description: Target Purchase Order Number

response_context:
  - value: $target_result.assignment_id
    description: Assignment ID
  - value: $target_result.driver_name
    description: Assigned driver
  - value: $target_result.vehicle_reg
    description: Assigned vehicle
  - value: $target_result.message
    description: Dispatch confirmation

target:
  name: create_assignment
  type: function
