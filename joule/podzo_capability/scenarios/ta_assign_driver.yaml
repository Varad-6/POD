description: |
  Pairs and assigns a fleet driver and vehicle to a Sales Order (SO) or Purchase Order transport run.

slots:
  - name: driver_id
    description: Driver name or ID (e.g. Rajesh)
  - name: vehicle_id
    description: Vehicle registration or ID (e.g. MH12AB1234)
  - name: po_id
    description: Target Sales Order Number or Purchase Order Number (e.g. 2318, 2321, 2322)

response_context:
  - value: $target_result.assignment_id
    description: Assignment ID or Trip ID
  - value: $target_result.driver_name
    description: Assigned driver
  - value: $target_result.vehicle_reg
    description: Assigned vehicle
  - value: $target_result.message
    description: Dispatch confirmation

target:
  name: create_assignment
  type: function
