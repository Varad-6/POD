description: |
  Fetches all open exception items in the PODZO Review Queue blocking MIRO.

slots: []

response_context:
  - value: $target_result.total_count
    description: Total number of review exceptions
  - value: $target_result.open_count
    description: Open exceptions count
  - value: $target_result.summary
    description: List of flagged review exceptions

target:
  name: get_review_queue
  type: function
