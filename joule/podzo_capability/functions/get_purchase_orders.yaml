parameters: []

result:
  summary: <? pos_res.body.summary ?>
  total_count: <? pos_res.body.total_count ?>
  open_count: <? pos_res.body.open_count ?>
  assigned_count: <? pos_res.body.assigned_count ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: GET
        path: /api/v3/joule/purchase-orders
        timeout: 10
        result_variable: pos_res

  - condition: pos_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Could not fetch purchase orders from PODZO.
