parameters: []

result:
  summary: <? rq_res.body.summary ?>
  total_count: <? rq_res.body.total_count ?>
  open_count: <? rq_res.body.open_count ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: GET
        path: /api/v3/joule/review-queue
        timeout: 10
        result_variable: rq_res

  - condition: rq_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Unable to load review queue items.
