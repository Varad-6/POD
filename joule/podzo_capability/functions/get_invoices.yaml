parameters: []

result:
  summary: <? inv_res.body.summary ?>
  total_count: <? inv_res.body.total_count ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: GET
        path: /api/v3/joule/invoices
        timeout: 10
        result_variable: inv_res

  - condition: inv_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Could not fetch freight invoices from PODZO.
