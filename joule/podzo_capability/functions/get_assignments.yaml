parameters: []

result:
  summary: <? asgn_res.body.summary ?>
  total_count: <? asgn_res.body.total_count ?>
  assignment_id: <? asgn_res.body.sample_assignment_id ?>
  driver_name: <? asgn_res.body.sample_driver_name ?>
  vehicle_reg: <? asgn_res.body.sample_vehicle_reg ?>
  status: <? asgn_res.body.sample_status ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: GET
        path: /api/v3/joule/assignments
        timeout: 10
        result_variable: asgn_res

  - condition: asgn_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Could not retrieve transport assignments from PODZO.
