parameters:
  - name: po_id
    optional: true
  - name: transporter_id
    optional: true

result:
  job_config_id: <? dist_res.body.id ?>
  message: <? dist_res.body.message ?>
  status: <? dist_res.status_code ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: POST
        path: /api/v3/po/distribute
        headers:
          Content-Type: application/json
        body:
          po_id: <? po_id ?>
          transporter_id: <? transporter_id ?>
          availability_window_start: "06:00"
          availability_window_end: "18:00"
        timeout: 10
        result_variable: dist_res

  - condition: dist_res.status_code != 201 && dist_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Purchase Order distribution could not be completed.
