parameters:
  - name: po_id
    optional: true
  - name: transporter_id
    optional: true

result:
  job_config_id: <? dist_res.body.id ?>
  message: <? dist_res.body.message ?>
  status: <? dist_res.status_code ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: POST
        path: /api/v3/joule/distribute-so
        headers:
          Content-Type: application/json
        body:
          so_no: <? po_id ?>
          transporter_name: <? transporter_id ?>
        timeout: 10
        result_variable: dist_res

  - condition: dist_res.status_code != 201 && dist_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Sales Order distribution could not be completed.
