parameters:
  - name: driver_id
    optional: true
  - name: vehicle_id
    optional: true
  - name: po_id
    optional: true
  - name: scheduled_date
    optional: true

result:
  assignment_id: <? cr_res.body.id ?>
  driver_name: <? cr_res.body.driver_name ?>
  vehicle_reg: <? cr_res.body.vehicle_reg ?>
  message: <? cr_res.body.message ?>
  status: <? cr_res.status_code ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: POST
        path: /api/v3/assignments
        headers:
          Content-Type: application/json
        body:
          driver_id: <? driver_id ?>
          vehicle_id: <? vehicle_id ?>
          po_id: <? po_id ?>
          scheduled_date: <? scheduled_date ?>
        timeout: 10
        result_variable: cr_res

  - condition: cr_res.status_code != 201 && cr_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Failed to assign driver and vehicle to transport run.
