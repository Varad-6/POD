parameters: []

result:
  summary: <? contracts_res.body.summary ?>
  total_count: <? contracts_res.body.total_count ?>
  active_count: <? contracts_res.body.active_count ?>
  contract_no: <? contracts_res.body.sample_contract_no ?>
  customer_name: <? contracts_res.body.sample_customer_name ?>

action_groups:
  - actions:
      - type: api-request
        system_alias: PodzoneService
        method: GET
        path: /api/v3/joule/contracts
        timeout: 10
        result_variable: contracts_res

  - condition: contracts_res.status_code != 200
    actions:
      - type: message
        message:
          type: text
          content: Unable to retrieve active contracts from PODZO.
