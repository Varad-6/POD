applications:
  # ── 1. Backend Server ───────────────────────────────────────────────
  - name: PODZ-srv
    path: .
    memory: 256M
    disk_quota: 512M
    random-route: true
    command: npm run server
    env:
      PORT: 3001
      NODE_ENV: production

  # ── 2. Frontend Web Assets (HTML/JS/CSS Host) ──────────────────────
  - name: PODZ-ui
    path: ./dist
    memory: 128M
    disk_quota: 256M
    random-route: true
    buildpacks:
      - staticfile_buildpack
