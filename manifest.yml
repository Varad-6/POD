---
applications:
  # ── 1. Backend Server ───────────────────────────────────────────────
  - name: podzone-srv
    path: .
    memory: 256M
    disk_quota: 512M
    random-route: true
    command: npm run server
    env:
      NODE_ENV: production

  # ── 2. Frontend Work Zone Portal App ────────────────────────────────
  - name: podzone
    path: ./dist
    memory: 128M
    disk_quota: 256M
    random-route: true
    buildpacks:
      - staticfile_buildpack
