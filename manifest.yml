---
applications:
  # ── 1. Backend Server ───────────────────────────────────────────────
  - name: podzone-srv
    path: .
    memory: 256M
    disk_quota: 512M
    routes:
      - route: podz-srv-abhiyanta.cfapps.eu10-005.hana.ondemand.com
    command: npm run server
    env:
      NODE_ENV: production

  # ── 2. Frontend Work Zone Portal App ────────────────────────────────
  - name: podzone
    path: ./dist
    memory: 128M
    disk_quota: 256M
    routes:
      - route: podz-ui-abhiyanta.cfapps.eu10-005.hana.ondemand.com
      - route: podz-ui-resplendent-hyena-wl.cfapps.eu10-005.hana.ondemand.com
    buildpacks:
      - staticfile_buildpack
